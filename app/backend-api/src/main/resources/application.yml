spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: notebooklm
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notebooklm}
    username: ${SPRING_DATASOURCE_USERNAME:notebooklm}
    password: ${SPRING_DATASOURCE_PASSWORD:notebooklm}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AWS_ENDPOINT_URL:http://localhost:4566}/${COGNITO_USER_POOL_ID:}
  ai:
    openai:
      base-url: ${SPRING_AI_OPENAI_BASE_URL:}
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      chat:
        model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:}
      embedding:
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL:openai/text-embedding-3-large}
          # truncado pra 1536: pgvector HNSW nao indexa acima de 2000 dimensoes,
          # e text-embedding-3-large nativo sai em 3072
          dimensions: 1536
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1536

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      s3:
        path-style-access-enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint-url: ${AWS_ENDPOINT_URL:http://localhost:4566}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}
  s3:
    bucket-name: ${S3_BUCKET_NAME:}
  sqs:
    ingestion-queue-url: ${SQS_INGESTION_QUEUE_URL:}
