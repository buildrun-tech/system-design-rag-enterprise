name: frontend

# Reutilizável: chamado pelo pipeline.yml (gatilhos, path filter e ordem "infra antes do deploy" vivem lá).
# PR (develop|main): lint + build.
# push develop = dev: build, guarda dist/ como artifact (`frontend-dist-<sha>`) + deploy S3/CloudFront.
# push main    = prod: reusa o dist/ do run de develop pro mesmo sha (sem rebuild) + deploy S3/CloudFront.
# Bucket/distribuição vêm de `terraform output` (infra/, add-terraform-infra), não de repository variables.

on:
  workflow_call:

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::069765036136:role/ghactions-rag-enterprise
  TF_STATE_BUCKET: terraform-statefile-069765036136-us-east-2-an
  TF_STATE_REGION: us-east-2

permissions:
  contents: read

jobs:
  ci:
    name: CI - Lint & Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  push-dev:
    name: Build Artifact (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: app/frontend/dist
          retention-days: 7
          if-no-files-found: error

  deploy-frontend-dev:
    name: Deploy Frontend (dev)
    needs: push-dev
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read Terraform Outputs
        id: tf
        uses: ./.github/actions/terraform-outputs
        with:
          environment: dev
      - name: Sync to S3
        run: aws s3 sync dist "s3://${{ steps.tf.outputs.frontend_bucket_name }}" --delete
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cloudfront_distribution_id }}" --paths "/*"

  promote-frontend-prod:
    name: Promote Artifact (dev to prod)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Artifact from dev Run (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # artifact pelo nome (independe do status das outras trilhas do run de develop)
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=frontend-dist-$GITHUB_SHA" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::Artifact frontend-dist-$GITHUB_SHA não encontrado (ou expirado). Sem rebuild automático: o commit precisa ter passado por develop (artifact expira em 7 dias)."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "frontend-dist-$GITHUB_SHA" -D dist
      - name: Upload Promoted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-prod-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy-frontend-prod:
    name: Deploy Frontend (prod)
    needs: promote-frontend-prod
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-prod-${{ github.sha }}
          path: dist
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read Terraform Outputs
        id: tf
        uses: ./.github/actions/terraform-outputs
        with:
          environment: prod
      - name: Sync to S3
        run: aws s3 sync dist "s3://${{ steps.tf.outputs.frontend_bucket_name }}" --delete
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.cloudfront_distribution_id }}" --paths "/*"
