name: infra

# develop = dev, main = prod (envs em infra/envs/<env>/terraform.tfvars, state em S3 por ambiente).
# PR (develop|main):  ci (fmt + validate, sem AWS) + plan (lê state, não altera nada).
# push develop|main:  apply (plan -out + apply do plano salvo).
# workflow_dispatch:  destroy manual, gateado por infra/destroy_config.json.
# Nunca destroy em push.

on:
  pull_request:
    branches: [develop, main]
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/actions/terraform-init/**']
  push:
    branches: [develop, main]
    paths: ['infra/**', '.github/workflows/infra.yml', '.github/actions/terraform-init/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a destruir
        type: choice
        options: [dev, prod]
        required: true

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::069765036136:role/ghactions-rag-enterprise
  TF_STATE_BUCKET: terraform-statefile-069765036136-us-east-2-an
  TF_STATE_REGION: us-east-2

permissions:
  contents: read

jobs:
  ci:
    name: CI - Terraform Format & Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform -chdir=infra fmt -check -recursive
      - name: Terraform Init (no backend)
        run: terraform -chdir=infra init -backend=false
      - name: Terraform Validate
        run: terraform -chdir=infra validate

  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # base develop = dev, base main = prod
    env:
      TARGET_ENV: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          environment: ${{ env.TARGET_ENV }}
      # -lock=false: PR só lê, não trava o state de um apply em andamento
      - name: Terraform Plan
        run: terraform -chdir=infra plan -lock=false -var-file="envs/$TARGET_ENV/terraform.tfvars"

  apply:
    name: Terraform Apply
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # environment com required reviewers no prod = aprovação antes do apply
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    # serializa applies do mesmo ambiente (state lock cobre o resto)
    concurrency:
      group: terraform-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          environment: ${{ env.TARGET_ENV }}
      - name: Terraform Plan
        run: terraform -chdir=infra plan -out=tfplan -var-file="envs/$TARGET_ENV/terraform.tfvars"
      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve tfplan

  destroy:
    name: Terraform Destroy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # environment com required reviewers = segunda trava humana antes do destroy
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Destroy Gate (destroy_config.json)
        run: |
          allowed=$(jq -r --arg env "$TARGET_ENV" '.[$env]' infra/destroy_config.json)
          if [ "$allowed" != "true" ]; then
            echo "::error::destroy de '$TARGET_ENV' desativado em infra/destroy_config.json (valor: $allowed). Abortando."
            exit 1
          fi
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        uses: ./.github/actions/terraform-init
        with:
          environment: ${{ env.TARGET_ENV }}
      - name: Terraform Destroy
        run: terraform -chdir=infra destroy -auto-approve -var-file="envs/$TARGET_ENV/terraform.tfvars"
