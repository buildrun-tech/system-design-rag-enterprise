name: Terraform init (backend S3)
description: >
  Instala terraform e faz init com o backend S3 (bucket/region do env do workflow,
  key por ambiente). Requer credenciais AWS já configuradas no job e
  TF_STATE_BUCKET / TF_STATE_REGION no env.

inputs:
  environment:
    description: dev | prod
    required: true

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform Init (S3 backend)
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.environment }}
      run: |
        terraform -chdir=infra init \
          -backend-config="bucket=$TF_STATE_BUCKET" \
          -backend-config="region=$TF_STATE_REGION" \
          -backend-config="key=rag-enterprise/$TARGET_ENV/terraform.tfstate"
